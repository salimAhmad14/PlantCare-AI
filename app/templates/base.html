<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PlantCare{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="{{ url_for('index') }}">PlantCare</a>
  <span class="masthead-note">Leaf diagnosis with sourced advice</span>
</header>

<main class="shell">
  {% block content %}{% endblock %}
</main>

<footer class="colophon">
  <p>Guidance is quoted from government IPM packages for grape, tomato and wheat.
     Every line carries the document and page it came from. This tool supports a
     decision; it does not replace an agriculture officer.</p>
</footer>
</body>
</html>
